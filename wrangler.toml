name = "wofadmin"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Build Output Directory
# Defines the directory containing static assets and _worker.js
pages_build_output_dir = "dist"

# Cloudflare KV Namespace configuration (Optional - for persistent edge storage)
# To bind KV in Cloudflare:
# 1. Run: npx wrangler kv:namespace create WOF_KV
# 2. Uncomment and paste the generated namespace id below:
# [[kv_namespaces]]
# binding = "WOF_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"
